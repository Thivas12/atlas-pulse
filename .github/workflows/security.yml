name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit locked Python dependencies
        run: uv audit --frozen

      - name: Audit locked npm dependencies
        working-directory: web
        run: npm audit --package-lock-only --audit-level=moderate

  container-vulnerability-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime images from immutable inputs
        run: |
          docker build --tag "atlas-pulse-api:${{ github.sha }}" .
          docker build --tag "atlas-pulse-web:${{ github.sha }}" web
          docker build \
            --tag "atlas-pulse-edge:${{ github.sha }}" \
            --file deploy/free-tier/Dockerfile \
            .
          docker build \
            --tag "atlas-pulse-postgres:${{ github.sha }}" \
            --file docker/postgres/Dockerfile \
            .
          valkey_image="$(
            python3 -c \
              'import json; print(json.load(open("deploy/container-images.json"))["valkey"])'
          )"
          docker pull "$valkey_image"

      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: false

      - name: Report all high and critical runtime findings
        run: |
          valkey_image="$(
            python3 -c \
              'import json; print(json.load(open("deploy/container-images.json"))["valkey"])'
          )"
          for image in \
            "atlas-pulse-api:${{ github.sha }}" \
            "atlas-pulse-web:${{ github.sha }}" \
            "atlas-pulse-edge:${{ github.sha }}" \
            "atlas-pulse-postgres:${{ github.sha }}" \
            "$valkey_image"; do
            trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --no-progress \
              "$image"
          done

      - name: Reject fixable high and critical operating-system findings
        run: |
          valkey_image="$(
            python3 -c \
              'import json; print(json.load(open("deploy/container-images.json"))["valkey"])'
          )"
          scan_status=0
          for image in \
            "atlas-pulse-api:${{ github.sha }}" \
            "atlas-pulse-web:${{ github.sha }}" \
            "atlas-pulse-edge:${{ github.sha }}" \
            "atlas-pulse-postgres:${{ github.sha }}" \
            "$valkey_image"; do
            trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --pkg-types os \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "$image" || scan_status=1
          done
          exit "$scan_status"

  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
