name: atlas-pulse

x-atlas-environment: &atlas-environment
  ATLAS_ENVIRONMENT: local-compose
  ATLAS_LOG_LEVEL: INFO
  ATLAS_VALKEY_URL: valkey://valkey:6379/0
  ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
  ATLAS_RAW_DATA_DIR: /app/data/raw

services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *atlas-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment: *atlas-environment
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  ingestor:
    build: .
    command: ["atlas-pulse-ingest"]
    restart: unless-stopped
    environment: *atlas-environment
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - raw-snapshots:/app/data/raw

  projector:
    build: .
    command: ["atlas-pulse-project"]
    restart: unless-stopped
    environment: *atlas-environment
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgis-data:
  raw-snapshots:
  valkey-data:
