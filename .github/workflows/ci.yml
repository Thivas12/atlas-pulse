name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend / lint, type-check, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 10
    env:
      ATLAS_TEST_VALKEY_URL: valkey://localhost:6379/0
      ATLAS_TEST_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas_test
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start PostGIS plus pgvector
        run: |
          docker build --tag atlas-pulse-postgres-ci --file docker/postgres/Dockerfile .
          docker run --detach --name atlas-pulse-postgres-ci \
            --env POSTGRES_DB=atlas_test \
            --env POSTGRES_USER=atlas \
            --env POSTGRES_PASSWORD=atlas \
            --publish 5432:5432 \
            atlas-pulse-postgres-ci
          for attempt in {1..30}; do
            if docker exec atlas-pulse-postgres-ci pg_isready -U atlas -d atlas_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs atlas-pulse-postgres-ci
          exit 1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Test with branch coverage
        run: uv run pytest --cov=atlas_pulse --cov-branch --cov-report=term-missing

      - name: Stop test database
        if: always()
        run: docker rm --force atlas-pulse-postgres-ci || true

  frontend:
    name: Frontend / lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and check formatting
        run: npm run lint

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Type-check and build production assets
        run: npm run build

  containers:
    name: Containers / build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Verify FIRMS credential is ingestor-only
        run: |
          ATLAS_FIRMS_ENABLED=true ATLAS_FIRMS_MAP_KEY=ci-sentinel \
            docker compose config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          assert services["ingestor"]["environment"]["ATLAS_FIRMS_MAP_KEY"] == "ci-sentinel"
          assert all(
              "ATLAS_FIRMS_MAP_KEY" not in service.get("environment", {})
              for name, service in services.items()
              if name != "ingestor"
          )'

      - name: Build production images
        run: docker compose build

      - name: Start API, projectors, and web edge
        run: docker compose up -d --wait --wait-timeout 120 api projector retrieval-indexer web

      - name: Smoke-test edge routing
        run: |
          curl --fail --silent --show-error http://localhost:3000/ | grep --fixed-strings '<title>AtlasPulse'
          curl --fail --silent --show-error http://localhost:3000/api/readyz | grep --fixed-strings '"status":"ready"'
          curl --fail --silent --show-error \
            'http://localhost:3000/api/v1/search?q=earthquake' | python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          assert response["embedding_model"] == "BAAI/bge-small-en-v1.5"
          assert response["count"] == 0'
          curl --fail --silent --show-error \
            'http://localhost:3000/api/v1/evidence-packs?q=earthquake' | python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          assert response["pack_id"].startswith("pack-")
          assert response["status"] == "no_traceable_evidence"
          assert response["answer_generated"] is False
          assert response["item_count"] == 0
          assert response["exclusion_count"] == 0
          assert response["retrieval"]["embedding_model"] == "BAAI/bge-small-en-v1.5"'

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
