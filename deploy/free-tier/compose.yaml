services:
  valkey:
    mem_limit: 512m
    cpus: 0.50

  postgres:
    mem_limit: 2g
    cpus: 1.00

  migrate:
    mem_limit: 1g
    cpus: 0.75

  api:
    mem_limit: 2g
    cpus: 1.00

  ingestor:
    mem_limit: 1g
    cpus: 0.75

  projector:
    mem_limit: 1g
    cpus: 0.75

  retrieval-indexer:
    mem_limit: 2g
    cpus: 1.25

  web:
    mem_limit: 256m
    cpus: 0.50

  edge:
    build:
      context: .
      dockerfile: deploy/free-tier/Dockerfile
    image: atlas-pulse-edge:2.11.4-alpine
    restart: unless-stopped
    environment:
      ATLAS_PUBLIC_HOST: ${ATLAS_PUBLIC_HOST:?set ATLAS_PUBLIC_HOST to a public DNS name}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/free-tier/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50

volumes:
  caddy-data:
  caddy-config:
