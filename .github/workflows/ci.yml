name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend / lint, type-check, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 10
    env:
      ATLAS_TEST_VALKEY_URL: valkey://localhost:6379/0
      ATLAS_TEST_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas_test
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start PostGIS plus pgvector
        run: |
          docker build --tag atlas-pulse-postgres-ci --file docker/postgres/Dockerfile .
          docker run --detach --name atlas-pulse-postgres-ci \
            --env POSTGRES_DB=atlas_test \
            --env POSTGRES_USER=atlas \
            --env POSTGRES_PASSWORD=atlas \
            --publish 5432:5432 \
            atlas-pulse-postgres-ci
          for attempt in {1..30}; do
            if docker exec atlas-pulse-postgres-ci pg_isready -U atlas -d atlas_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs atlas-pulse-postgres-ci
          exit 1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Verify operations CLI entry point
        run: uv run atlas-pulse-operations --help

      - name: Test with branch coverage
        run: uv run pytest --cov=atlas_pulse --cov-branch --cov-report=term-missing

      - name: Stop test database
        if: always()
        run: docker rm --force atlas-pulse-postgres-ci || true

  frontend:
    name: Frontend / lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and check formatting
        run: npm run lint

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Type-check and build production assets
        run: npm run build

  containers:
    name: Containers / build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ATLAS_BUILD_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Validate free-tier HTTPS overlay
        run: |
          ATLAS_PUBLIC_HOST=atlas.203-0-113-10.sslip.io \
            docker compose -f compose.yaml -f deploy/free-tier/compose.yaml config --quiet
          ATLAS_AGENT_RELEASE_ASSESSMENT_HOST_PATH=/tmp/atlas-release-assessment.json \
            docker compose \
              -f compose.yaml \
              -f deploy/release-assessment.compose.yaml \
              config --quiet

      - name: Verify polling policy parity and FIRMS credential scope
        run: |
          ATLAS_FIRMS_ENABLED=true ATLAS_FIRMS_MAP_KEY=ci-sentinel \
          ATLAS_USGS_POLL_SECONDS=61 ATLAS_GDELT_SOURCE_STALE_SECONDS=3601 \
            docker compose config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          assert services["ingestor"]["environment"]["ATLAS_FIRMS_MAP_KEY"] == "ci-sentinel"
          policy_keys = (
              "ATLAS_USGS_POLL_SECONDS",
              "ATLAS_USGS_SOURCE_STALE_SECONDS",
              "ATLAS_NWS_POLL_SECONDS",
              "ATLAS_NWS_SOURCE_STALE_SECONDS",
              "ATLAS_FIRMS_ENABLED",
              "ATLAS_FIRMS_POLL_SECONDS",
              "ATLAS_FIRMS_SOURCE_STALE_SECONDS",
              "ATLAS_GDELT_ENABLED",
              "ATLAS_GDELT_POLL_SECONDS",
              "ATLAS_GDELT_SOURCE_STALE_SECONDS",
              "ATLAS_SOURCE_POLL_STALE_MULTIPLIER",
              "ATLAS_SOURCE_POLL_HISTORY_STREAM",
              "ATLAS_SOURCE_POLL_HISTORY_MAX_LENGTH",
          )
          assert all(
              services["api"]["environment"][key]
              == services["ingestor"]["environment"][key]
              for key in policy_keys
          )
          assert all(
              "ATLAS_FIRMS_MAP_KEY" not in service.get("environment", {})
              for name, service in services.items()
              if name != "ingestor"
          )'

      - name: Build production images
        run: docker compose build

      - name: Start API, projectors, and web edge
        run: |
          if ! docker compose up -d --wait --wait-timeout 120 \
            api projector retrieval-indexer web; then
            docker compose ps --all
            docker compose logs --no-color migrate
            exit 1
          fi

      - name: Smoke-test edge routing
        run: |
          curl --fail --silent --show-error http://localhost:3000/ | grep --fixed-strings '<title>AtlasPulse'
          curl --fail --silent --show-error http://localhost:3000/api/readyz | python3 -c '
          import json, os, sys
          response = json.load(sys.stdin)
          assert response == {
              "status": "ready",
              "version": "0.12.0",
              "commit_sha": os.environ["ATLAS_BUILD_COMMIT_SHA"],
          }'
          curl --fail --silent --show-error \
            http://localhost:3000/api/v1/source-freshness | python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          assert response["passed"] is False
          assert response["execution_enabled"] is False
          assert [item["source"] for item in response["items"]] == ["gdelt", "nws", "usgs"]
          assert all(item["poll_status"] == "starting" for item in response["items"])
          assert all(item["source_data_status"] == "not_reported" for item in response["items"])'
          curl --fail --silent --show-error \
            'http://localhost:3000/api/v1/source-polls?limit=12' | python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          assert response["schema_version"] == "1.0.0"
          assert response["rule_version"] == "source-poll-history-v1"
          assert response["count"] == 0
          assert response["items"] == []
          assert response["next_cursor"] is None
          assert response["has_more"] is False
          assert response["order"] == "newest_first"
          assert response["execution_enabled"] is False'
          curl --fail --silent --show-error \
            'http://localhost:3000/api/v1/search?q=earthquake' | python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          assert response["embedding_model"] == "BAAI/bge-small-en-v1.5"
          assert response["count"] == 0'
          curl --fail --silent --show-error \
            'http://localhost:3000/api/v1/evidence-packs?q=earthquake' | python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          assert response["pack_id"].startswith("pack-")
          assert response["status"] == "no_traceable_evidence"
          assert response["answer_generated"] is False
          assert response["item_count"] == 0
          assert response["exclusion_count"] == 0
          assert response["retrieval"]["embedding_model"] == "BAAI/bge-small-en-v1.5"'
          curl --fail --silent --show-error \
            'http://localhost:3000/api/v1/agent-runs/preflight?q=earthquake' | python3 -c '
          import json, sys
          response = json.load(sys.stdin)
          pack = response["evidence_pack"]
          manifest = response["manifest"]
          assert pack["status"] == "no_traceable_evidence"
          assert manifest["manifest_id"].startswith("manifest-")
          assert manifest["status"] == "blocked"
          assert manifest["evidence"]["pack_id"] == pack["pack_id"]
          assert manifest["release"]["status"] == "not_supplied"
          assert len(manifest["authorization"]["checks"]) == 11
          assert manifest["authorization"]["blocking_reasons"][0] == "no_traceable_evidence"
          assert manifest["execution"] == {
              "status": "not_started",
              "agent_model_invoked": False,
              "agent_network_accessed": False,
              "agent_tools_invoked": False,
              "answer_generated": False,
              "agent_side_effects_performed": False,
          }'

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
