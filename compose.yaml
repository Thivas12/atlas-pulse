name: atlas-pulse

x-atlas-python-build: &atlas-python-build
  context: .
  args:
    ATLAS_BUILD_COMMIT_SHA: ${ATLAS_BUILD_COMMIT_SHA:-unknown}

x-atlas-runtime-environment: &atlas-runtime-environment
  ATLAS_ENVIRONMENT: ${ATLAS_ENVIRONMENT:-local-compose}
  ATLAS_LOG_LEVEL: INFO

x-atlas-source-policy: &atlas-source-policy
  # The API and ingestor must evaluate the exact same enabled-source polling policy.
  ATLAS_USGS_POLL_SECONDS: ${ATLAS_USGS_POLL_SECONDS:-60}
  ATLAS_USGS_SOURCE_STALE_SECONDS: ${ATLAS_USGS_SOURCE_STALE_SECONDS:-600}
  ATLAS_NWS_POLL_SECONDS: ${ATLAS_NWS_POLL_SECONDS:-120}
  ATLAS_NWS_SOURCE_STALE_SECONDS: ${ATLAS_NWS_SOURCE_STALE_SECONDS:-900}
  ATLAS_FIRMS_ENABLED: ${ATLAS_FIRMS_ENABLED:-false}
  ATLAS_FIRMS_POLL_SECONDS: ${ATLAS_FIRMS_POLL_SECONDS:-900}
  ATLAS_FIRMS_SOURCE_STALE_SECONDS: ${ATLAS_FIRMS_SOURCE_STALE_SECONDS:-129600}
  ATLAS_GDELT_ENABLED: ${ATLAS_GDELT_ENABLED:-true}
  ATLAS_GDELT_POLL_SECONDS: ${ATLAS_GDELT_POLL_SECONDS:-900}
  ATLAS_GDELT_SOURCE_STALE_SECONDS: ${ATLAS_GDELT_SOURCE_STALE_SECONDS:-3600}
  ATLAS_SOURCE_POLL_STALE_MULTIPLIER: ${ATLAS_SOURCE_POLL_STALE_MULTIPLIER:-3}
  ATLAS_SOURCE_POLL_HISTORY_STREAM: "${ATLAS_SOURCE_POLL_HISTORY_STREAM:-{atlas}:source-polls}"
  ATLAS_SOURCE_POLL_HISTORY_MAX_LENGTH: ${ATLAS_SOURCE_POLL_HISTORY_MAX_LENGTH:-50000}

x-atlas-valkey-environment: &atlas-valkey-environment
  ATLAS_VALKEY_URL: valkey://valkey:6379/0

x-atlas-database-environment: &atlas-database-environment
  ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas

services:
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    command: ["valkey-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      api-valkey:
      ingestor-valkey:
      projector-valkey:
      indexer-valkey:
      valkey-host:
        gw_priority: 1

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: atlas-pulse-postgres:17-postgis3.5-pgvector0.8.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      api-postgres:
      migrate-postgres:
      projector-postgres:
      indexer-postgres:
      postgres-host:
        gw_priority: 1

  migrate:
    build: *atlas-python-build
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: [*atlas-runtime-environment, *atlas-database-environment]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - migrate-postgres

  api:
    build: *atlas-python-build
    restart: unless-stopped
    environment:
      <<:
        [
          *atlas-runtime-environment,
          *atlas-source-policy,
          *atlas-valkey-environment,
          *atlas-database-environment,
        ]
      ATLAS_AGENT_APPROVAL_TRUSTED_KEY_IDS: ${ATLAS_AGENT_APPROVAL_TRUSTED_KEY_IDS:-[]}
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      api-valkey:
      api-postgres:
      api-web:
      api-host:
        gw_priority: 1

  ingestor:
    build: *atlas-python-build
    command: ["atlas-pulse-ingest"]
    restart: unless-stopped
    environment:
      <<: [*atlas-runtime-environment, *atlas-source-policy, *atlas-valkey-environment]
      ATLAS_RAW_DATA_DIR: /app/data/raw
      # The FIRMS credential is intentionally available only to this source-facing process.
      ATLAS_FIRMS_MAP_KEY: ${ATLAS_FIRMS_MAP_KEY:-}
      ATLAS_FIRMS_PRODUCT: ${ATLAS_FIRMS_PRODUCT:-VIIRS_NOAA20_NRT}
      ATLAS_FIRMS_AREA: ${ATLAS_FIRMS_AREA:-world}
      ATLAS_FIRMS_DAY_RANGE: ${ATLAS_FIRMS_DAY_RANGE:-1}
      ATLAS_FIRMS_ACTIVE_WINDOW_HOURS: ${ATLAS_FIRMS_ACTIVE_WINDOW_HOURS:-24}
      ATLAS_GDELT_LAST_UPDATE_URL: ${ATLAS_GDELT_LAST_UPDATE_URL:-https://data.gdeltproject.org/gdeltv2/lastupdate.txt}
      ATLAS_GDELT_ACTIVE_WINDOW_HOURS: ${ATLAS_GDELT_ACTIVE_WINDOW_HOURS:-24}
      ATLAS_GDELT_ONLY_ROOT_EVENTS: ${ATLAS_GDELT_ONLY_ROOT_EVENTS:-true}
      ATLAS_GDELT_MINIMUM_GEO_PRECISION: ${ATLAS_GDELT_MINIMUM_GEO_PRECISION:-3}
      ATLAS_GDELT_MINIMUM_MENTIONS: ${ATLAS_GDELT_MINIMUM_MENTIONS:-1}
      ATLAS_GDELT_MAX_COMPRESSED_BYTES: ${ATLAS_GDELT_MAX_COMPRESSED_BYTES:-25000000}
      ATLAS_GDELT_MAX_UNCOMPRESSED_BYTES: ${ATLAS_GDELT_MAX_UNCOMPRESSED_BYTES:-100000000}
      ATLAS_GDELT_MAX_ROWS: ${ATLAS_GDELT_MAX_ROWS:-100000}
      ATLAS_GDELT_MAX_EVENTS: ${ATLAS_GDELT_MAX_EVENTS:-5000}
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - raw-snapshots:/app/data/raw
    networks:
      ingestor-valkey:
      source-egress:
        gw_priority: 1

  projector:
    build: *atlas-python-build
    command: ["atlas-pulse-project"]
    restart: unless-stopped
    environment:
      <<:
        [*atlas-runtime-environment, *atlas-valkey-environment, *atlas-database-environment]
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - projector-valkey
      - projector-postgres

  retrieval-indexer:
    build: *atlas-python-build
    command: ["atlas-pulse-index"]
    restart: unless-stopped
    environment:
      <<:
        [
          *atlas-runtime-environment,
          *atlas-valkey-environment,
          *atlas-database-environment,
        ]
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - indexer-valkey
      - indexer-postgres

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      api-web:
      web-host:
        gw_priority: 1

networks:
  api-valkey:
    internal: true
  ingestor-valkey:
    internal: true
  projector-valkey:
    internal: true
  indexer-valkey:
    internal: true
  api-postgres:
    internal: true
  migrate-postgres:
    internal: true
  projector-postgres:
    internal: true
  indexer-postgres:
    internal: true
  api-web:
    internal: true
  valkey-host:
  postgres-host:
  api-host:
  web-host:
  source-egress:

volumes:
  postgis-data:
  raw-snapshots:
  valkey-data:
