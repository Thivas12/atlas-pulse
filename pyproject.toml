[project]
name = "atlas-pulse"
version = "0.4.0"
description = "Real-time, evidence-grounded global disruption intelligence"
readme = "README.md"
authors = [
    { name = "Keerthivasan Kannan" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-rag-core",
    "alembic>=1.16.4,<2",
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.116.1,<1",
    "httpx>=0.28.1,<1",
    "geoalchemy2>=0.18.0,<1",
    "opentelemetry-api>=1.36.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-instrumentation-httpx>=0.57b0,<1",
    "opentelemetry-sdk>=1.36.0,<2",
    "pydantic-settings>=2.10.1,<3",
    "structlog>=26.1.0,<27",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "tenacity>=9.1.2,<10",
    "uvicorn[standard]>=0.35.0,<1",
    "valkey>=6.1.0,<7",
]

[project.scripts]
atlas-pulse-ingest = "atlas_pulse.worker:main"
atlas-pulse-project = "atlas_pulse.projector:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.138.2,<7",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.1.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.12.9,<1",
]

[tool.uv.sources]
agent-rag-core = { git = "https://github.com/Thivas12/agent-rag-core.git", rev = "773280199ecd8401629c3ad7b367037ab7745e7f" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires an external service",
]

[tool.coverage.run]
branch = true
source = ["atlas_pulse"]
omit = [
    "src/atlas_pulse/asgi.py",
    "src/atlas_pulse/projector.py",
    "src/atlas_pulse/telemetry.py",
    "src/atlas_pulse/worker.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
