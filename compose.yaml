name: atlas-pulse

x-atlas-python-build: &atlas-python-build
  context: .
  args:
    ATLAS_BUILD_COMMIT_SHA: ${ATLAS_BUILD_COMMIT_SHA:-unknown}

x-atlas-environment: &atlas-environment
  ATLAS_ENVIRONMENT: ${ATLAS_ENVIRONMENT:-local-compose}
  ATLAS_LOG_LEVEL: INFO
  ATLAS_VALKEY_URL: valkey://valkey:6379/0
  ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
  ATLAS_RAW_DATA_DIR: /app/data/raw
  ATLAS_EMBEDDING_CACHE_DIR: /opt/atlas-models
  ATLAS_EMBEDDING_MODEL_PATH: /opt/atlas-models/bge-small-en-v1.5
  ATLAS_EMBEDDING_LOCAL_FILES_ONLY: "true"
  ATLAS_AGENT_APPROVAL_TRUSTED_KEY_IDS: ${ATLAS_AGENT_APPROVAL_TRUSTED_KEY_IDS:-[]}

services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: atlas-pulse-postgres:17-postgis3.5-pgvector0.8.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: *atlas-python-build
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *atlas-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *atlas-python-build
    restart: unless-stopped
    environment: *atlas-environment
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  ingestor:
    build: *atlas-python-build
    command: ["atlas-pulse-ingest"]
    restart: unless-stopped
    environment:
      <<: *atlas-environment
      # The FIRMS credential is intentionally available only to this source-facing process.
      ATLAS_FIRMS_ENABLED: ${ATLAS_FIRMS_ENABLED:-false}
      ATLAS_FIRMS_MAP_KEY: ${ATLAS_FIRMS_MAP_KEY:-}
      ATLAS_FIRMS_PRODUCT: ${ATLAS_FIRMS_PRODUCT:-VIIRS_NOAA20_NRT}
      ATLAS_FIRMS_AREA: ${ATLAS_FIRMS_AREA:-world}
      ATLAS_FIRMS_DAY_RANGE: ${ATLAS_FIRMS_DAY_RANGE:-1}
      ATLAS_FIRMS_POLL_SECONDS: ${ATLAS_FIRMS_POLL_SECONDS:-900}
      ATLAS_FIRMS_ACTIVE_WINDOW_HOURS: ${ATLAS_FIRMS_ACTIVE_WINDOW_HOURS:-24}
      ATLAS_GDELT_ENABLED: ${ATLAS_GDELT_ENABLED:-true}
      ATLAS_GDELT_LAST_UPDATE_URL: ${ATLAS_GDELT_LAST_UPDATE_URL:-https://data.gdeltproject.org/gdeltv2/lastupdate.txt}
      ATLAS_GDELT_POLL_SECONDS: ${ATLAS_GDELT_POLL_SECONDS:-900}
      ATLAS_GDELT_ACTIVE_WINDOW_HOURS: ${ATLAS_GDELT_ACTIVE_WINDOW_HOURS:-24}
      ATLAS_GDELT_ONLY_ROOT_EVENTS: ${ATLAS_GDELT_ONLY_ROOT_EVENTS:-true}
      ATLAS_GDELT_MINIMUM_GEO_PRECISION: ${ATLAS_GDELT_MINIMUM_GEO_PRECISION:-3}
      ATLAS_GDELT_MINIMUM_MENTIONS: ${ATLAS_GDELT_MINIMUM_MENTIONS:-1}
      ATLAS_GDELT_MAX_COMPRESSED_BYTES: ${ATLAS_GDELT_MAX_COMPRESSED_BYTES:-25000000}
      ATLAS_GDELT_MAX_UNCOMPRESSED_BYTES: ${ATLAS_GDELT_MAX_UNCOMPRESSED_BYTES:-100000000}
      ATLAS_GDELT_MAX_ROWS: ${ATLAS_GDELT_MAX_ROWS:-100000}
      ATLAS_GDELT_MAX_EVENTS: ${ATLAS_GDELT_MAX_EVENTS:-5000}
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - raw-snapshots:/app/data/raw

  projector:
    build: *atlas-python-build
    command: ["atlas-pulse-project"]
    restart: unless-stopped
    environment: *atlas-environment
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  retrieval-indexer:
    build: *atlas-python-build
    command: ["atlas-pulse-index"]
    restart: unless-stopped
    environment: *atlas-environment
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgis-data:
  raw-snapshots:
  valkey-data:
